name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages trades this for a short-lived deployment token; without it the
  # job cannot publish, whatever the repository settings say.
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but
# keep only the newest queued one - the others would publish stale commits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `install`: it installs the lockfile exactly and
      # fails if package.json has drifted from it, so a deployed build matches
      # what was tested locally.
      - run: npm ci

      - name: Build
        # A project site is served from /<repo>/, so the bundle's asset URLs and
        # the router's mount point both have to be told where they will live.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
